apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: default
  labels:
    app: mosquitto
spec:
  replicas: 1
  # Strategy type Recreate is safer for ReadWriteOnce PVCs 
  # to avoid two pods fighting for the same volume during updates.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      securityContext:
        fsGroup: 1883 # Grants the mosquitto container user write access to the PVC
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0
          ports:
            - containerPort: 8883
            - containerPort: 8884
          volumeMounts:
            - name: mosquitto-config-volume
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: mosquitto-certs-volume
              mountPath: /mosquitto/config/certs
              readOnly: true
            - name: mosquitto-passwd-volume
              mountPath: /mosquitto/config/passwd
              subPath: passwd
              readOnly: true
            - name: mosquitto-data-volume
              mountPath: /mosquitto/data
      volumes:
        - name: mosquitto-config-volume
          configMap:
            name: mosquitto-config
        - name: mosquitto-certs-volume
          secret:
            secretName: mosquitto-certs
        - name: mosquitto-passwd-volume
          secret:
            secretName: mosquitto-passwd
        - name: mosquitto-data-volume
          persistentVolumeClaim:
            claimName: mosquitto-data-pvc