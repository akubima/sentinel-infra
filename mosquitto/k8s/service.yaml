apiVersion: v1
kind: Service
metadata:
  name: mosquitto-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: mosquitto
  ports:
    - name: mtls-devices
      protocol: TCP
      port: 8883
      targetPort: 8883
    - name: tls-grafana
      protocol: TCP
      port: 8884
      targetPort: 8884