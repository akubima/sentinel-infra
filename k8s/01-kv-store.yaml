apiVersion: v1
kind: ServiceAccount
metadata:
  name: kv-prod-sa
  namespace: sentinel-infra

---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kv-prod
  namespace: sentinel-infra
spec:
  provider:
    vault:
      server: "http://vault-service.vault.svc.cluster.local:8200"
      path: "sentinel-kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "kv-prod-role"
          serviceAccountRef:
            name: "kv-prod-sa"