apiVersion: v1
kind: Service
metadata:
  name: vault-internal-service
  namespace: vault
  labels:
    app: vault
spec:
  ports:
    - name: http
      port: 8200
      targetPort: 8200
    - name: internal
      port: 8201
      targetPort: 8201
  selector:
    app: vault
  clusterIP: None
  publishNotReadyAddresses: true

---
apiVersion: v1
kind: Service
metadata:
  name: vault-service
  namespace: vault
  labels:
    app: vault
spec:
  selector:
    app: vault
  ports:
    - name: http
      port: 8200
      targetPort: 8200
  type: ClusterIP
  externalIPs:
    - 10.33.102.168
    - 10.33.102.253
  sessionAffinity: ClientIP
