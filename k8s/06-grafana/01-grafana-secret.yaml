apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secret-eso
  namespace: sentinel-infra
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: kv
    kind: SecretStore
  target:
    name: grafana-secret
    creationPolicy: Owner
  data:
    - secretKey: smtp_user
      remoteRef:
        key: "prod/grafana"
        property: smtp_user
    - secretKey: smtp_password
      remoteRef:
        key: "prod/grafana"
        property: smtp_password
