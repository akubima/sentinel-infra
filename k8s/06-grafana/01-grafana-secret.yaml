apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-grafana-rw-eso
  namespace: sentinel-infra
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: kv
    kind: SecretStore
  target:
    name: postgres-grafana-rw-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: "prod/postgres"
        property: grafana_rw_user
    - secretKey: password
      remoteRef:
        key: "prod/postgres"
        property: grafana_rw_password
---
