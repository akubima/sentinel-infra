apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: sentinel-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      annotations:
        secret.reloader.stakater.com/reload: "postgres-grafana-rw-secret,postgres-grafana-ro-secret,grafana-secret"
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        supplementalGroups:
          - 0
      containers:
        - name: grafana
          image: grafana/grafana:13.0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SERVER_ROOT_URL
              value: https://grafana-sentinel-tedi.bima.dev
            - name: GF_DATABASE_TYPE
              value: postgres
            - name: GF_DATABASE_HOST
              value: postgres-rw.sentinel-infra.svc.cluster.local:5432
            - name: GF_DATABASE_NAME
              value: grafana
            - name: GF_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-grafana-rw-secret
                  key: username
            - name: GF_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-grafana-rw-secret
                  key: password
            - name: DATA_DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-grafana-ro-secret
                  key: username
            - name: DATA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-grafana-ro-secret
                  key: password
            - name: GF_SMTP_ENABLED
              value: "true"
            - name: GF_SMTP_HOST
              value: "smtp-relay.brevo.com:587"
            - name: GF_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: smtp_user
            - name: GF_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: smtp_password
            - name: GF_SMTP_FROM_ADDRESS
              value: "notification@postalservice.bima.dev"
            - name: GF_SMTP_FROM_NAME
              value: "Grafana"
          ports:
            - containerPort: 3000
              name: http-grafana
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /robots.txt
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 3000
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 150m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
