apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secret-eso
  namespace: sentinel-infra
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: kv
    kind: SecretStore
  target:
    name: postgres-secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: "prod/postgres"
        property: user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: "prod/postgres"
        property: password