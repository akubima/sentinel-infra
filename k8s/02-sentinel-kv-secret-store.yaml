apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: sentinel-kv
  namespace: sentinel-infra
spec:
  provider:
    vault:
      server: "http://vault-service.vault.svc.cluster.local:8200"
      path: "sentinel-kv"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-secret
          key: root-token