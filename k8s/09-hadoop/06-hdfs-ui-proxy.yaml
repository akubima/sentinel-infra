apiVersion: v1
kind: ConfigMap
metadata:
  name: hdfs-ui-proxy-config
  namespace: sentinel-infra
data:
  nginx.conf: |
    worker_processes auto;
    events {
        worker_connections 1024;
    }
    http {
        include       mime.types;
        default_type  application/octet-stream;
        sendfile        on;
        keepalive_timeout  65;

        # Use Kubernetes DNS for resolving DataNode hostnames internally
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

        server {
            listen 80;
            server_name _;

            # Allow downloading large files
            client_max_body_size 0;
            proxy_buffering off;

            location / {
                proxy_pass http://hadoop-service:9870;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                
                # Intercept 307 Temporary Redirect from NameNode
                proxy_intercept_errors on;
                error_page 307 = @handle_redirect;
            }

            location @handle_redirect {
                # Extract the DataNode URL from the Location header
                set $saved_redirect_location '$upstream_http_location';
                
                # Proxy the request directly to the DataNode internally, 
                # streaming the data directly back to the user without redirecting the browser.
                proxy_pass $saved_redirect_location;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hdfs-ui-proxy
  namespace: sentinel-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hdfs-ui-proxy
  template:
    metadata:
      labels:
        app: hdfs-ui-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config
          configMap:
            name: hdfs-ui-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: hdfs-ui-proxy
  namespace: sentinel-infra
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app: hdfs-ui-proxy
