apiVersion: v1
kind: Service
metadata:
  name: hadoop-datanode-headless
  namespace: sentinel-infra
spec:
  clusterIP: None
  selector:
    app: hadoop-datanode
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hadoop-datanode
  namespace: sentinel-infra
spec:
  serviceName: hadoop-datanode-headless
  replicas: 2
  selector:
    matchLabels:
      app: hadoop-datanode
  template:
    metadata:
      labels:
        app: hadoop-datanode
    spec:
      initContainers:
        - name: remove-lost-found
          image: ghcr.io/apache/hadoop:3.5.0
          securityContext:
            runAsUser: 0
          command:
            - "/bin/bash"
            - "-c"
            - "rm -rf /hadoop/dfs/data/lost+found && chown -R hadoop:hadoop /hadoop/dfs/data"
          volumeMounts:
            - name: datanode-storage
              mountPath: /hadoop/dfs/data
      containers:
        - name: datanode
          image: ghcr.io/apache/hadoop:3.5.0
          command: ["/opt/hadoop/bin/hdfs", "datanode"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: datanode-storage
              mountPath: /hadoop/dfs/data
            - name: hadoop-config-vol
              mountPath: /opt/hadoop/etc/hadoop/core-site.xml
              subPath: core-site.xml
            - name: hadoop-config-vol
              mountPath: /opt/hadoop/etc/hadoop/hdfs-site.xml
              subPath: hdfs-site.xml
      volumes:
        - name: hadoop-config-vol
          configMap:
            name: hadoop-config
  volumeClaimTemplates:
    - metadata:
        name: datanode-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-retained
        resources:
          requests:
            storage: 5Gi
