apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hadoop-datanode
  namespace: sentinel-infra
spec:
  serviceName: hadoop-namenode-service
  replicas: 2
  selector:
    matchLabels:
      app: hadoop-datanode
  template:
    metadata:
      labels:
        app: hadoop-datanode
    spec:
      initContainers:
        - name: remove-lost-found
          image: busybox:1.36
          command: ["sh", "-c", "rm -rf /hadoop/dfs/data/lost+found"]
          volumeMounts:
            - name: datanode-storage
              mountPath: /hadoop/dfs/data
      containers:
        - name: datanode
          image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
          env:
            - name: CORE_CONF_fs_defaultFS
              value: "hdfs://hadoop-namenode-service:9000"
            - name: HDFS_CONF_dfs_replication
              value: "3"
            - name: HDFS_CONF_dfs_permissions
              value: "false"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: datanode-storage
              mountPath: /hadoop/dfs/data
  volumeClaimTemplates:
    - metadata:
        name: datanode-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-retained
        resources:
          requests:
            storage: 15Gi