apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secret-eso
  namespace: sso
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: kv
    kind: SecretStore
  target:
    name: authentik-secret
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: prod/authentik
        property: secret_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secret-eso
  namespace: sso
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: kv
    kind: SecretStore
  target:
    name: postgres-secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: prod/postgres
        property: user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: prod/postgres
        property: password
