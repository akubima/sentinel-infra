apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioning
  namespace: sentinel-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provisioning
  template:
    metadata:
      labels:
        app: provisioning
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "provisioning-role"
        vault.hashicorp.com/agent-service-mesh-init: "true"
        vault.hashicorp.com/agent-inject-command-certs.json: "kill -HUP 1"
        vault.hashicorp.com/agent-cache-enable: "true"
        vault.hashicorp.com/agent-cache-use-auto-auth-token: "true"
        vault.hashicorp.com/agent-listen-port: "8200"

        vault.hashicorp.com/agent-inject-secret-db-password: "secret/data/database"
        vault.hashicorp.com/agent-inject-template-db-password: |
          {{- with secret "secret/data/database" -}}
          {{ .Data.data.password }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-certs.json: "sentinel/issue/infrastructure"
        vault.hashicorp.com/agent-inject-template-certs.json: |
          {{- with secret "sentinel/issue/infrastructure" "common_name=provisioning-service.sentinel-stack.svc.cluster.local" "ip_sans=127.0.0.1" -}}
          {
            "certificate": {{ .Data.certificate | toJSON }},
            "private_key": {{ .Data.private_key | toJSON }},
            "ca_chain": {{ .Data.ca_chain | toJSON }}
          }
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-ca.crt: "sentinel/cert/ca"
        vault.hashicorp.com/agent-inject-template-ca.crt: |
          {{- with secret "sentinel/cert/ca" -}}
          {{ .Data.certificate }}
          {{- end -}}
    spec:
      serviceAccountName: provisioning-sa
      containers:
        - name: provisioning
          image: provisioning:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: PORT
              value: "3001"
            - name: VAULT_ADDR
              value: "http://localhost:8200"
            - name: PGHOST
              value: "timescaledb.sentinel-stack.svc.cluster.local"
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: timescaledb-config
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: timescaledb-config
                  key: POSTGRES_USER