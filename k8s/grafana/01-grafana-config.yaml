apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: sentinel-infra
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: postgres-rw.sentinel-infra.svc.cluster.local
        type: postgres
        access: proxy
        url: postgres-rw.sentinel-infra.svc.cluster.local:5432
        user: ${DATA_DB_USER}
        database: "sentinel"
        isDefault: true
        jsonData:
          sslmode: "disable"
          postgresVersion: 15.00
          timescaledb: true
          timeInterval: "1s"
        secureJsonData:
          password: ${GF_DATABASE_PASSWORD}
        editable: true