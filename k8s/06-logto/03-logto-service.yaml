apiVersion: v1
kind: Service
metadata:
  name: logto-service
  namespace: sso
spec:
  ports:
    - name: http-api
      port: 3001
      targetPort: 3001
      protocol: TCP
    - name: http-admin
      port: 3002
      targetPort: 3002
      protocol: TCP
  selector:
    app: logto
  sessionAffinity: ClientIP
  type: ClusterIP
