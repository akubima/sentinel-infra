apiVersion: v1
kind: Service
metadata:
  name: logto-service
  namespace: sso
spec:
  ports:
    - name: http-api
      port: 3003
      targetPort: 3003
      protocol: TCP
    - name: http-admin
      port: 3004
      targetPort: 3004
      protocol: TCP
  selector:
    app: logto
  sessionAffinity: ClientIP
  type: ClusterIP
