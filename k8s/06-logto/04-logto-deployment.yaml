apiVersion: apps/v1
kind: Deployment
metadata:
  name: logto
  namespace: sso
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logto
  template:
    metadata:
      annotations:
        secret.reloader.stakater.com/reload: "postgres-secret,logto-secret"
      labels:
        app: logto
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - logto
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h postgres-rw.sentinel-infra.svc.cluster.local -p 5432; do
                echo "Waiting for postgres-rw database to be ready...";
                sleep 2;
              done
      containers:
        - name: logto
          image: svhd/logto:1.39.0
          ports:
            - containerPort: 3001
              name: http-api
            - containerPort: 3002
              name: http-admin
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DB_URL
              value: postgres://$(DB_USER):$(DB_PASSWORD)@postgres-rw.sentinel-infra.svc.cluster.local:5432/logto
            - name: SECRET_VAULT_KEK
              valueFrom:
                secretKeyRef:
                  name: logto-secret
                  key: SECRET_VAULT_KEK
            - name: ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: logto-config
                  key: ENDPOINT
            - name: ADMIN_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: logto-config
                  key: ADMIN_ENDPOINT
            - name: TRUST_PROXY_HEADER
              value: "true"
          readinessProbe:
            httpGet:
              path: /api/status
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/status
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
