apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: logto-secret-eso
  namespace: sso
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: kv
    kind: SecretStore
  target:
    name: logto-secret
    creationPolicy: Owner
  data:
    - secretKey: SECRET_VAULT_KEK
      remoteRef:
        key: "prod/logto"
        property: secret_vault_kek
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secret-eso
  namespace: sso
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: kv
    kind: SecretStore
  target:
    name: postgres-secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: "prod/postgres"
        property: user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: "prod/postgres"
        property: password
