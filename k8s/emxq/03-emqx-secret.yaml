apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: emqx-cert
  namespace: sentinel-infra
spec:
  secretName: emqx-cert-secret
  duration: 2160h
  renewBefore: 720h
  commonName: emqx-service.sentinel-infra.svc.cluster.local
  dnsNames:
    - emqx-service.sentinel-infra.svc.cluster.local
    - emqx-service
    - localhost
    - mqtts-emqx-sentinel-tedi.bima.dev
  ipAddresses:
    - 10.33.102.168
    - 127.0.0.1
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - client auth
  additionalOutputFormats:
    - type: CombinedPEM
  issuerRef:
    name: emqx-issuer
    kind: Issuer