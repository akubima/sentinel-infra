apiVersion: apps/v1
kind: Deployment
metadata:
  name: emqx
  namespace: sentinel-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emqx
  template:
    metadata:
      labels:
        app: emqx
    spec:
      serviceAccountName: emqx-sa
      securityContext:
        fsGroup: 1000
      containers:
        - name: emqx
          image: emqx/emqx-enterprise:6.0.0
          securityContext:
            runAsUser: 1000
          ports:
            - containerPort: 8883
            - containerPort: 18083
          env:
            - name: EMQX_LISTENERS__SSL__DEFAULT__BIND
              value: "0.0.0.0:8883"
            - name: EMQX_LISTENERS__WSS__DEFAULT__BIND
              value: "0.0.0.0:8084"
            - name: EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CACERTFILE
              value: "/opt/emqx/certs/ca.crt"
            - name: EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE
              value: "/opt/emqx/certs/tls.crt"
            - name: EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE
              value: "/opt/emqx/certs/tls.key"
            - name: EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERIFY
              value: "verify_peer"
            - name: EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__FAIL_IF_NO_PEER_CERT
              value: "true"
            - name: EMQX_LISTENERS__WSS__DEFAULT__SSL_OPTIONS__CACERTFILE
              value: "/opt/emqx/certs/ca.crt"
            - name: EMQX_LISTENERS__WSS__DEFAULT__SSL_OPTIONS__CERTFILE
              value: "/opt/emqx/certs/tls.crt"
            - name: EMQX_LISTENERS__WSS__DEFAULT__SSL_OPTIONS__KEYFILE
              value: "/opt/emqx/certs/tls.key"
            - name: EMQX_DASHBOARD__LISTENERS__HTTP__BIND
              value: "18083"
            # PostgreSQL connector settings
            - name: EMQX_CONNECTORS__PGSQL__postgres-sentinel-infra__SERVER
              value: "postgres-rw.sentinel-infra.svc.cluster.local:5432"
            - name: EMQX_CONNECTORS__PGSQL__postgres-sentinel-infra__DATABASE
              value: "sentinel"
            - name: EMQX_CONNECTORS__PGSQL__postgres-sentinel-infra__USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: EMQX_CONNECTORS__PGSQL__postgres-sentinel-infra__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: EMQX_CONNECTORS__PGSQL__postgres-sentinel-infra__POOL_SIZE
              value: "8"
          livenessProbe:
            tcpSocket:
              port: 18083
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 18083
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 300m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: emqx-certs-storage
              mountPath: /opt/emqx/certs
              readOnly: true
            - name: emqx-temporary-storage
              mountPath: /opt/emqx/data
      volumes:
        - name: emqx-temporary-storage
          emptyDir: {}
        - name: emqx-certs-storage
          secret:
            secretName: emqx-cert-secret