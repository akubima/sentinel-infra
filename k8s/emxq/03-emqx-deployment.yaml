apiVersion: apps/v1
kind: Deployment
metadata:
  name: emqx
  namespace: sentinel-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emqx
  template:
    metadata:
      labels:
        app: emqx
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "emqx-role"
        vault.hashicorp.com/agent-service-mesh-init: "true"

        vault.hashicorp.com/agent-inject-command-cert.pem: "kill -HUP 1"
        vault.hashicorp.com/agent-inject-secret-ca.pem: "sentinel/issue/infrastructure"
        vault.hashicorp.com/agent-inject-template-ca.pem: |
          {{- with secret "sentinel/issue/infrastructure" "common_name=emqx-service.sentinel-stack.svc.cluster.local" "ttl=365d" -}}
          {{ .Data.issuing_ca }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-cert.pem: "sentinel/issue/infrastructure"
        vault.hashicorp.com/agent-inject-template-cert.pem: |
          {{- with secret "sentinel/issue/infrastructure" "common_name=emqx-service.sentinel-stack.svc.cluster.local" "ttl=365d" -}}
          {{ .Data.certificate }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-key.pem: "sentinel/issue/infrastructure"
        vault.hashicorp.com/agent-inject-template-key.pem: |
          {{- with secret "sentinel/issue/infrastructure" "common_name=emqx-service.sentinel-stack.svc.cluster.local" "ttl=365d" -}}
          {{ .Data.private_key }}
          {{- end -}}
    spec:
      serviceAccountName: emqx-sa
      containers:
        - name: emqx
          image: emqx/emqx-enterprise:latest
          ports:
            - containerPort: 8883
            - containerPort: 18083
          env:
            - name: EMQX_LISTENERS__SSL__DEFAULT__BIND
              value: "0.0.0.0:8883"
            - name: EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CACERTFILE
              value: "/vault/secrets/ca.pem"
            - name: EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE
              value: "/vault/secrets/cert.pem"
            - name: EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE
              value: "/vault/secrets/key.pem"
            - name: EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERIFY
              value: "verify_peer"
            - name: EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__FAIL_IF_NO_PEER_CERT
              value: "true"
            - name: EMQX_LISTENERS__WSS__DEFAULT__SSL_OPTIONS__CACERTFILE
              value: "/vault/secrets/ca.pem"
            - name: EMQX_LISTENERS__WSS__DEFAULT__SSL_OPTIONS__CERTFILE
              value: "/vault/secrets/cert.pem"
            - name: EMQX_LISTENERS__WSS__DEFAULT__SSL_OPTIONS__KEYFILE
              value: "/vault/secrets/key.pem"
            - name: EMQX_DASHBOARD__LISTENERS__HTTP__BIND
              value: "18083"
          livenessProbe:
            tcpSocket:
              port: 18083
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 18083
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: emqx-data-storage
              mountPath: /opt/emqx/data
      volumes:
        - name: emqx-data-storage
          persistentVolumeClaim:
            claimName: emqx-data-pvc