apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: emqx-issuer
  namespace: sentinel-infra
spec:
  vault:
    server: http://vault-service.vault.svc.cluster.local:8200
    path: sentinel-pki/sign/infrastructure-prod
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: emqx-role
        serviceAccountRef:
          name: emqx-sa