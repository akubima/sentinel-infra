apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: timescaledb-secret-eso
  namespace: sentinel-infra
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: timescaledb-secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: prod
        property: database_user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: prod
        property: database_password