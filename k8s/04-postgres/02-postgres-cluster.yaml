apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: sentinel-infra
  annotations:
    secret.reloader.stakater.com/reload: "postgres-secret"
spec:
  instances: 1
  managed:
    roles:
      - name: grafana-rw
        ensure: present
        login: true
        passwordSecret:
          name: postgres-grafana-rw-secret
      - name: grafana-ro
        ensure: present
        login: true
        passwordSecret:
          name: postgres-grafana-ro-secret
      - name: bridge-rw
        ensure: present
        login: true
        passwordSecret:
          name: postgres-bridge-rw-secret
  imageName: ghcr.io/imusmanmalik/timescaledb-postgis:17-3.5
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  bootstrap:
    initdb:
      secret:
        name: postgres-secret
      owner: sentinel
      database: sentinel
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS timescaledb;
        - CREATE EXTENSION IF NOT EXISTS pgcrypto;
        - GRANT ALL ON SCHEMA public TO sentinel;
      postInitApplicationSQL:
        # Buat role aplikasi terlebih dahulu
        - CREATE ROLE "grafana-rw" WITH LOGIN;
        - CREATE ROLE "grafana-ro" WITH LOGIN;
        - CREATE ROLE "bridge-rw" WITH LOGIN;

        # Berikan hak akses skema public di DB utama
        - GRANT ALL ON SCHEMA public TO sentinel;

        # Berikan izin untuk membuat role baru (diperlukan untuk inisialisasi Logto)
        - ALTER ROLE sentinel WITH CREATEROLE;

        # Buat fungsi ULID dan langsung amankan kepemilikannya
        - |
          CREATE OR REPLACE FUNCTION generate_ulid() RETURNS TEXT AS $_$
          DECLARE
            encoding   TEXT = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
            time_ms    BIGINT = (EXTRACT(EPOCH FROM NOW()) * 1000)::BIGINT;
            res        TEXT = '';
            i          INTEGER;
            bytes      BYTEA;
            val        INTEGER;
          BEGIN
          -- Menggunakan fungsi bawaan crypto v17 yang dijamin aman tanpa dependensi pgcrypto lama
            bytes = gen_random_bytes(11);

            FOR i IN REVERSE 9..0 LOOP
            res = res || SUBSTR(encoding, ((time_ms >> (i * 5)) & 31)::INTEGER + 1, 1);
            END LOOP;

            FOR i IN 0..15 LOOP
            val = (get_byte(bytes, (i * 5) / 8) << 8) | get_byte(bytes, ((i * 5) / 8) + 1);
            res = res || SUBSTR(encoding, ((val >> (11 - (i * 5) % 8)) & 31)::INTEGER + 1, 1);
            END LOOP;

            RETURN res;
          END;
          $_$ LANGUAGE plpgsql VOLATILE;
        - ALTER FUNCTION generate_ulid() OWNER TO sentinel;
        # Buat database pendukung untuk Grafana dengan owner sentinel agar tidak ada kendala izin skema public di pg15+
        - CREATE DATABASE grafana OWNER sentinel;
        - ALTER DATABASE grafana OWNER TO "grafana-rw";

        # Buat tabel devices dan set pemiliknya ke sentinel
        - |
          CREATE TABLE devices (
              id VARCHAR(26) PRIMARY KEY DEFAULT generate_ulid(),
              node_id VARCHAR(17) UNIQUE,
              name VARCHAR(30),
              location VARCHAR(120),
              latitude DECIMAL(9,6),
              longitude DECIMAL(9,6),
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP NULL DEFAULT NULL
          );
        - ALTER TABLE devices OWNER TO sentinel;
        # Masukkan baris data contoh awal
        - |
          INSERT INTO devices (node_id, name, location, latitude, longitude)
          VALUES ('CE2BF215788', 'Prototype Node', 'Department TEDI', -7.775418, 110.374250);

        # Buat tabel telemetry dan set pemiliknya ke sentinel
        - |
          CREATE TABLE device_telemetry (
              time    TIMESTAMPTZ NOT NULL,
              id      VARCHAR(26) NOT NULL,
              metrics JSONB       NOT NULL,
          
              CONSTRAINT uq_device_time UNIQUE (id, time)
          );
        - ALTER TABLE device_telemetry OWNER TO sentinel;
        # Nyalakan fitur hypertable TimescaleDB bawaan
        - SELECT create_hypertable('device_telemetry', 'time');
        - CREATE INDEX idx_id_time ON device_telemetry(id, time DESC);

        # Berikan izin koneksi, skema, dan tabel ke grafana-rw
        - GRANT CONNECT ON DATABASE sentinel TO "grafana-rw";
        - GRANT USAGE ON SCHEMA public TO "grafana-rw";
        - GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO "grafana-rw";
        - GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO "grafana-rw";
        - ALTER DEFAULT PRIVILEGES FOR ROLE sentinel IN SCHEMA public GRANT ALL ON TABLES TO "grafana-rw";
        - ALTER DEFAULT PRIVILEGES FOR ROLE sentinel IN SCHEMA public GRANT ALL ON SEQUENCES TO "grafana-rw";

        # Berikan izin koneksi, skema, dan tabel (Read-Only) ke grafana-ro
        - GRANT CONNECT ON DATABASE sentinel TO "grafana-ro";
        - GRANT USAGE ON SCHEMA public TO "grafana-ro";
        - GRANT SELECT ON ALL TABLES IN SCHEMA public TO "grafana-ro";
        - GRANT SELECT ON ALL SEQUENCES IN SCHEMA public TO "grafana-ro";
        - ALTER DEFAULT PRIVILEGES FOR ROLE sentinel IN SCHEMA public GRANT SELECT ON TABLES TO "grafana-ro";

        # Berikan izin koneksi, skema, dan tabel ke bridge-rw
        - GRANT CONNECT ON DATABASE sentinel TO "bridge-rw";
        - GRANT USAGE ON SCHEMA public TO "bridge-rw";
        - GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO "bridge-rw";
        - GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO "bridge-rw";
        - ALTER DEFAULT PRIVILEGES FOR ROLE sentinel IN SCHEMA public GRANT ALL ON TABLES TO "bridge-rw";
        - ALTER DEFAULT PRIVILEGES FOR ROLE sentinel IN SCHEMA public GRANT ALL ON SEQUENCES TO "bridge-rw";

        # Berikan izin eksekusi fungsi generate_ulid() ke penulis data
        - GRANT EXECUTE ON FUNCTION generate_ulid() TO "grafana-rw";
        - GRANT EXECUTE ON FUNCTION generate_ulid() TO "bridge-rw";
  postgresql:
    shared_preload_libraries:
      - "timescaledb"
    parameters:
      timezone: "UTC"
  storage:
    resizeInUseVolumes: true
    size: 5Gi
    storageClass: longhorn-retained
  backup:
    barmanObjectStore:
      destinationPath: "s3://sentinel-backup-905418361269-us-west-2-an/postgres-backup"
      s3Credentials:
        accessKeyId:
          name: postgres-backup-s3-creds
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: postgres-backup-s3-creds
          key: AWS_SECRET_ACCESS_KEY
      wal:
        retention: "7d"
        compression: gzip
      data:
        compression: gzip
        immediateCheckpoint: true
      retentionPolicy: "30d"
