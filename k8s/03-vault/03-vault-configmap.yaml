apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault
data:
  vault.json: |
    {
      "listener": {
        "tcp": {
          "address": "[::]:8200",
          "cluster_address": "[::]:8201",
          "tls_cert_file": "/vault/tls/tls.crt",
          "tls_key_file": "/vault/tls/tls.key"
        }
      },
      "storage": {
        "raft": {
          "path": "/vault/file"
        }
      },
      "disable_mlock": true,
      "ui": true
    }