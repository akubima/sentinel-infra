apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-watcher-role
  namespace: vault
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-watcher-rb
subjects:
  - kind: ServiceAccount
    name: vault-watcher-sa
    namespace: vault
roleRef:
  kind: ClusterRole
  name: vault-watcher-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-watcher-sa
  namespace: vault

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-watcher
  namespace: vault
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: vault-watcher-sa
          restartPolicy: OnFailure
          containers:
            - name: watcher-operator
              image: alpine/k8s:1.34.3
              command: ["/bin/sh", "-c"]
              args:
                - |
                  SECRET_EXISTS=$(kubectl get secret vault-secret -n vault --no-headers 2>/dev/null | awk '{print $1}')

                  VAULT0_STATUS_JSON=$(kubectl exec -n vault vault-0 -- vault status -format=json 2>/dev/null)
                  VAULT0_EXIT_CODE=$?

                  if [ $VAULT0_EXIT_CODE -eq 0 ] || [ $VAULT0_EXIT_CODE -eq 2 ]; then
                    VAULT0_INIT_STATUS=$(echo "$VAULT0_STATUS_JSON" | jq -r '.initialized' 2>/dev/null)
                  else
                    VAULT0_INIT_STATUS="UNKNOWN_ERROR"
                    echo "Failed to get vault-0 status. Exit code: $VAULT0_EXIT_CODE"
                  fi

                  if [ "$VAULT0_INIT_STATUS" = "false" ]; then
                    if [ -n "$SECRET_EXISTS" ]; then
                      echo "Failed vault-0 report initialized: false, but vault-secret already exists."
                      echo "Initialization stopped to protect the existing vault-secret."
                      exit 1
                    fi

                    echo "vault-0 is not initialized yet. Initializing vault..."
                    VAULT0_INIT_OUT=$(kubectl exec -n vault vault-0 -- vault operator init -key-shares=5 -key-threshold=3 -format=json 2>/dev/null)

                    ROOT_TOKEN=$(echo "$VAULT0_INIT_OUT" | jq -r '.root_token' 2>/dev/null)
                    UNSEAL_KEYS=$(echo "$VAULT0_INIT_OUT" | jq -r '.unseal_keys_b64 | join(",")' 2>/dev/null)

                    if [ "$ROOT_TOKEN" != "null" ] && [ -n "$ROOT_TOKEN" ] && [ "$UNSEAL_KEYS" != "null" ] && [ -n "$UNSEAL_KEYS" ]; then
                      kubectl delete secret vault-secret -n vault --ignore-not-found
                      kubectl create secret generic vault-secret -n vault \
                        --from-literal=root-token="$ROOT_TOKEN" \
                        --from-literal=unseal-keys="$UNSEAL_KEYS"
                      echo "Successfully initialized vault-0, vault-secret created."
                    else
                      echo "Failed to initialize vault-0."
                    fi
                  elif [ "$VAULT0_INIT_STATUS" = "true" ]; then
                    echo "vault-0 is already initialized, continuing..."
                  fi

                  PODS=$(kubectl get pods -n vault -l app=vault --no-headers -o custom-columns=":metadata.name" | sort)
                  KEYS=$(kubectl get secret vault-secret -n vault -o jsonpath='{.data.unseal-keys}' | base64 -d)
                  KEY1=$(echo $KEYS | cut -d',' -f1)
                  KEY2=$(echo $KEYS | cut -d',' -f2)
                  KEY3=$(echo $KEYS | cut -d',' -f3)

                  for POD_NAME in $PODS; do
                    echo "=================================================="
                    echo "Processing $POD_NAME..."
                    kubectl wait --for=jsonpath='{.status.phase}'=Running pod/$POD_NAME -n vault --timeout=30s || continue

                    INIT=$(kubectl exec -n vault $POD_NAME -- vault status 2>/dev/null | grep "^Initialized" | awk '{print $2}')
                    SEALED=$(kubectl exec -n vault $POD_NAME -- vault status 2>/dev/null | grep "^Sealed" | awk '{print $2}')
                    echo "$POD_NAME -> Initialized: $INIT, Sealed: $SEALED"

                    if [ "$INIT" = "false" ]; then
                      echo "$POD_NAME has not been initialized yet. Trying to join raft through active nodes..."
                      JOINED=false
                      for PEER in $PODS; do
                        if [ "$PEER" = "$POD_NAME" ]; then continue; fi
                        echo "Trying to join raft through https://${PEER}.vault-internal-service.vault.svc.cluster.local:8200 ..."
                        JOIN_RESULT=$(kubectl exec -n vault $POD_NAME -- vault operator raft join \
                          -leader-ca-cert=@/vault/tls/ca.crt \
                          https://${PEER}.vault-internal-service.vault.svc.cluster.local:8200 2>&1)
                        if echo "$JOIN_RESULT" | grep -qi "successfully\|joined"; then
                          echo "Successfully join raft through $PEER."
                          JOINED=true
                          break
                        fi
                      done
                      if [ "$JOINED" = "false" ]; then
                        echo "Failed to join raft for $POD_NAME."
                        continue
                      fi
                      SEALED="true"
                    fi

                    if [ "$SEALED" = "true" ]; then
                      echo "Unsealing $POD_NAME..."
                      kubectl exec -n vault $POD_NAME -- vault operator unseal $KEY1 >/dev/null
                      kubectl exec -n vault $POD_NAME -- vault operator unseal $KEY2 >/dev/null
                      UNSEAL_OUT=$(kubectl exec -n vault $POD_NAME -- vault operator unseal $KEY3 2>&1)

                      if echo "$UNSEAL_OUT" | grep -qi "error"; then
                        echo "Failed to unseal $POD_NAME because of internal/raft error:"
                        echo "$UNSEAL_OUT"
                        if [ "$POD_NAME" != "vault-0" ]; then
                          echo "Performing recovery, deleting corrupted pod $POD_NAME..."
                          kubectl exec -n vault $POD_NAME -- sh -c 'rm -rf /vault/file/*'
                          kubectl delete pod $POD_NAME -n vault
                        fi
                        continue
                      fi
                      echo "$POD_NAME unsealed."
                    else
                      echo "$POD_NAME is active and unsealed."
                    fi
                  done

                  # Replicate vault-cert-secret to other namespaces for ExternalSecrets trust verification
                  for NS in sentinel-infra kube-system sso; do
                    echo "Replicating vault-cert-secret to $NS namespace..."
                    kubectl get secret vault-cert-secret -n vault -o json 2>/dev/null | \
                      jq '.metadata.namespace = "'$NS'" | del(.metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp, .metadata.ownerReferences)' 2>/dev/null | \
                      kubectl apply -f - --force 2>/dev/null || true
                  done

                  if [ -z "$ROOT_TOKEN" ] && [ -n "$SECRET_EXISTS" ]; then
                    ROOT_TOKEN=$(kubectl get secret vault-secret -n vault -o jsonpath='{.data.root-token}' | base64 -d 2>/dev/null)
                  fi

                  # === AUTOMATED INITIAL SETUP CONFIGURATION FOR SENTINEL WORKSPACE ===
                  if [ -n "$ROOT_TOKEN" ]; then
                    SETUP_CHECK=$(kubectl exec -n vault vault-0 -- env VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  vault secrets list -format=json 2>/dev/null | jq -r '."sentinel-kv/"' 2>/dev/null)
                    if [ "$SETUP_CHECK" = "null" ] || [ -z "$SETUP_CHECK" ]; then
                      echo "=================================================="
                      echo "Sentinel Auth Roles not detected. Initiating deployment setup..."

                      kubectl exec -n vault vault-0 -- env VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  vault auth enable kubernetes || true
                      kubectl exec -n vault vault-0 -- env VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  sh -c '
                        vault write auth/kubernetes/config \
                        kubernetes_host="https://kubernetes.default.svc:443" \
                        kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                        disable_iss_validation=true \
                        disable_local_ca_jwt=false
                      '

                      kubectl exec -n vault vault-0 -- env VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  vault secrets enable -path=sentinel-kv kv-v2 || true
                      
                      PGPASS_DEV=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 64)
                      PGPASS_STG=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 64)
                      PGPASS_PROD=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 64)
                      
                      kubectl exec -n vault vault-0 -- env VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  vault kv put sentinel-kv/prod/postgres user="sentinel" password="$PGPASS_PROD" || true
                      kubectl exec -n vault vault-0 -- env VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  vault kv put sentinel-kv/stg/postgres user="sentinel" password="$PGPASS_STG" || true
                      kubectl exec -n vault vault-0 -- env VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  vault kv put sentinel-kv/dev/postgres user="sentinel" password="$PGPASS_DEV" || true

                      AUTHENTIK_SECRET_KEY_DEV=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 64)
                      AUTHENTIK_SECRET_KEY_STG=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 64)
                      AUTHENTIK_SECRET_KEY_PROD=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 64)

                      kubectl exec -n vault vault-0 -- env VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  vault kv put sentinel-kv/prod/authentik secret_key="$AUTHENTIK_SECRET_KEY_PROD" || true
                      kubectl exec -n vault vault-0 -- env VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  vault kv put sentinel-kv/stg/authentik secret_key="$AUTHENTIK_SECRET_KEY_STG" || true
                      kubectl exec -n vault vault-0 -- env VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  vault kv put sentinel-kv/dev/authentik secret_key="$AUTHENTIK_SECRET_KEY_DEV" || true
                      
                      kubectl exec -n vault vault-0 -- env VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  vault kv put sentinel-kv/prod/cloudflared token="" || true
                      kubectl exec -n vault vault-0 -- env VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  vault kv put sentinel-kv/stg/cloudflared token="" || true
                      kubectl exec -n vault vault-0 -- env VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  vault kv put sentinel-kv/dev/cloudflared token="" || true

                      REGISTRYPASS_DEV=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 64)
                      REGISTRYPASS_STG=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 64)
                      REGISTRYPASS_PROD=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 64)

                      kubectl exec -n vault vault-0 -- env VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  vault kv put sentinel-kv/prod/registry server_url="localhost:30500" username="sentinel" password="$REGISTRYPASS_PROD" || true
                      kubectl exec -n vault vault-0 -- env VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  vault kv put sentinel-kv/stg/registry server_url="localhost:30500" username="sentinel" password="$REGISTRYPASS_STG" || true
                      kubectl exec -n vault vault-0 -- env VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  vault kv put sentinel-kv/dev/registry server_url="localhost:30500" username="sentinel" password="$REGISTRYPASS_DEV" || true

                      BRIDGE_API_KEY_DEV=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 64)
                      BRIDGE_API_KEY_STG=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 64)
                      BRIDGE_API_KEY_PROD=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 64)

                      kubectl exec -n vault vault-0 -- env VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  vault kv put sentinel-kv/prod/bridge api_key="$BRIDGE_API_KEY_PROD" cert="" key="" ca="" || true
                      kubectl exec -n vault vault-0 -- env VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  vault kv put sentinel-kv/stg/bridge api_key="$BRIDGE_API_KEY_STG" cert="" key="" ca="" || true
                      kubectl exec -n vault vault-0 -- env VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  vault kv put sentinel-kv/dev/bridge api_key="$BRIDGE_API_KEY_DEV" cert="" key="" ca="" || true

                      # 4. Create Policies (Fed seamlessly via stdin to bypass multi-line quote restrictions)
                      echo 'path "sentinel-kv/data/prod" { capabilities = ["read"] } path "sentinel-kv/data/prod/*" { capabilities = ["read"] }' | kubectl exec -i -n vault vault-0 -- env VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  vault policy write kv-prod-policy -

                      # 5. Create Kubernetes Auth Engine Roles
                      kubectl exec -n vault vault-0 -- env VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  vault write auth/kubernetes/role/kv-role bound_service_account_names=kv-sa bound_service_account_namespaces=sentinel-infra,kube-system,sso policies=kv-prod-policy ttl=1h

                      echo "Automated Deployment Setup completed successfully."
                      echo "=================================================="
                    fi
                  fi
                  # === AUTOMATED INITIAL SETUP CONFIGURATION END ===

                  echo "=================================================="
                  echo "Checking for ghost peers in raft (stale peer)..."
                  K8S_PODS=$(kubectl get pods -n vault -l app=vault --no-headers -o custom-columns=":metadata.name")

                  kubectl exec -n vault vault-0 -- sh -c "VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  vault operator raft list-peers -format=json" 2>/dev/null | jq -r '.data.config.servers[] | "\(.node_id) \(.address)"' 2>/dev/null | while read -r NODE_ID ADDRESS; do
                      [ -z "$NODE_ID" ] && continue
                      POD_NAME_FROM_RAFT=$(echo "$ADDRESS" | cut -d'.' -f1)
                      if ! echo "$K8S_PODS" | grep -q "^$POD_NAME_FROM_RAFT$"; then
                        echo "Detected ghost peer: $NODE_ID (pod has been deleted from k8s)."
                        echo "Kicking ghost peer $NODE_ID from raft..."
                        kubectl exec -n vault vault-0 -- sh -c "VAULT_TOKEN=$ROOT_TOKEN VAULT_SKIP_VERIFY=true  vault operator raft remove-peer $NODE_ID"
                      else
                        echo "Pod $POD_NAME_FROM_RAFT (ID: $NODE_ID) is active."
                      fi
                  done
                  echo "Ghost peers detection completed."
