#For settig up the registry's credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-auth-eso
  namespace: kube-system
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: kv
    kind: SecretStore
  target:
    name: registry-auth-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/registry
  template:
    type: Opaque
    data:
      htpasswd: |
        {{ htpasswd .username .password }}
---
# For getting the registry's credentials that will be used by the sentinel-infra namespace for authenticating to the registry
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-secret-eso
  namespace: sentinel-infra
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: kv
    kind: SecretStore
  target:
    name: registry-secret
    creationPolicy: Owner
  template:
    type: kubernetes.io/dockerconfigjson
    data:
      .dockerconfigjson: |
        {"auths":{"{{ index . "docker-server" }}":{"username":"{{ index . "docker-username" }}","password":"{{ index . "docker-password" }}","auth":"{{ printf "%s:%s" (index . "docker-username") (index . "docker-password") | b64enc }}"}}}
  dataFrom:
    - extract:
        key: prod/registry