# For setting up the registry's credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-auth-eso
  namespace: kube-system
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: kv
    kind: SecretStore
  target:
    name: registry-auth-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        htpasswd: "{{ .username }}:{{ bcrypt .password }}"
  dataFrom:
    - extract:
        key: prod/registry
---
# For getting the registry's credentials for sentinel-infra namespace
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-secret-eso
  namespace: sentinel-infra
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: kv
    kind: SecretStore
  target:
    name: registry-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"localhost:30500":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  dataFrom:
    - extract:
        key: prod/registry