apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-secret-eso
  namespace: sentinel-infra
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: kv
    kind: SecretStore
  target:
    name: cloudflared-secret
    creationPolicy: Owner
  data:
    - secretKey: CLOUDFLARED_TOKEN
      remoteRef:
        key: "prod/cloudflared"
        property: token