apiVersion: v1
kind: Secret
metadata:
  name: provisioning-service-sa-token
  namespace: sentinel-infra
  annotations:
    kubernetes.io/service-account.name: provisioning-service-sa
type: kubernetes.io/service-account-token

---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: provisioning-service-issuer
  namespace: sentinel-infra
spec:
  vault:
    server: http://vault-service.vault.svc.cluster.local:8200
    path: sentinel-pki/sign/provisioning-service-role
    auth:
      kubernetes:
        role: provisioning-service-role
        mountPath: /v1/auth/kubernetes
        secretRef:
          name: provisioning-service-sa-token
          key: token