apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: provisioning-service-cert
  namespace: sentinel-infra
spec:
  secretName: provisioning-secret
  duration: 2160h
  renewBefore: 720h
  commonName: provisioning-service.sentinel-infra.svc.cluster.local
  dnsNames:
    - provisioning-service.sentinel-infra.svc.cluster.local
    - provisioning-service
    - localhost
  ipAddresses:
    - 10.33.102.168
    - 127.0.0.1
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - client auth
  issuerRef:
    name: provisioning-service-issuer
    kind: Issuer