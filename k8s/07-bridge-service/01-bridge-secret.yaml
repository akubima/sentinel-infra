apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bridge-secret-eso
  namespace: sentinel-infra
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: kv
    kind: SecretStore
  target:
    name: bridge-secret
    creationPolicy: Owner
  data:
    - secretKey: BRIDGE_API_KEY
      remoteRef:
        key: "prod/bridge"
        property: api_key
    - secretKey: BRIDGE_CERT
      remoteRef:
        key: "prod/bridge"
        property: cert
    - secretKey: BRIDGE_KEY
      remoteRef:
        key: "prod/bridge"
        property: key
    - secretKey: BRIDGE_CA
      remoteRef:
        key: "prod/bridge"
        property: ca
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-bridge-rw-eso
  namespace: sentinel-infra
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: kv
    kind: SecretStore
  target:
    name: postgres-bridge-rw-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: "prod/postgres"
        property: bridge_rw_user
    - secretKey: password
      remoteRef:
        key: "prod/postgres"
        property: bridge_rw_password