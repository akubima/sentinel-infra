apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf
  namespace: sentinel-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegraf
  template:
    metadata:
      labels:
        app: telegraf
    spec:
      containers:
        - name: telegraf
          image: telegraf:1.28
          env:
            - name: INFLUX_TOKEN
              valueFrom: { secretKeyRef: { name: influxdb-secret, key: admin-token } }
            - name: INFLUX_ORG
              valueFrom: { secretKeyRef: { name: influxdb-secret, key: influx-org } }
            - name: INFLUX_BUCKET
              valueFrom: { secretKeyRef: { name: influxdb-secret, key: influx-bucket } }
          volumeMounts:
            - name: telegraf-config-storage
              mountPath: /etc/telegraf/telegraf.conf
              subPath: telegraf.conf
            - name: telegraf-certs-storage
              mountPath: /etc/telegraf/certs
              readOnly: true
      volumes:
        - name: telegraf-config-storage
          configMap:
            name: telegraf-config
        - name: telegraf-certs-storage
          secret:
            secretName: telegraf-certs